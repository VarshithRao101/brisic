# One Netlify site serves the whole Brisic app: pages and backend
# (server actions, /api/auth) are deployed together by Netlify's Next.js runtime.
[build]
  base = "brisic-app"
  command = "npm run build:deploy"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # These env values are plain settings, not secrets ("mock", "true"). Netlify's
  # secret scanner treats every env value as secret and fails the build because
  # words like "mock" appear in library code. Real secrets are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "CATALOG_PROVIDER,AUTH_TRUST_HOST"

# The Next.js runtime turns the build into server functions. Without it Netlify
# uploads .next as static files and every page returns 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
