<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1022}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
let c = 1000, p = '';
try { const q = new URLSearchParams(location.search); c = Number(q.get('c')) || 1000; p = q.get('p') || ''; } catch (e) {}
this.state = { c: c, p: p };
}
renderVals() {
const s = this.state;
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const gold = s.c >= 1000;
let bal = 0 + s.c; try { const b = localStorage.getItem('brisic-coins'); if (b !== null) bal = Number(b); } catch (e) {}
const ref = 'BRS-' + String(Date.now()).slice(-8);
return {
fill: gold ? 'url(#coinGold)' : 'url(#coinSilver)', rim: gold ? '#a8741a' : '#6f7c82', ink: gold ? '#6b4a0a' : '#46535a',
coins: fmt(s.c),
rows: [{ k: 'Pack', v: fmt(s.c) + ' B-Coins' }, { k: 'Amount paid', v: s.p || ('\u20a6' + fmt(s.c)) }, { k: 'New balance', v: fmt(bal) + ' B-Coins' }, { k: 'Reference', v: ref }]
};
}
}
</script>
