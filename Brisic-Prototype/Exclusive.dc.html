<title>Exclusive Content</title>
<script src="./support.js"></script>
</head>

</div>

<a href="FanSupport.dc.html" aria-label="Back" style="position: absolute; z-index: 12; left: 22px; top: 74px; width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #7ee08a; display: flex; align-items: center; justify-content: center">

</a>
<div style="position: absolute; left: 0; right: 0; top: 74px; text-align: center">

<div style="margin-top: 8px; font-size: 15px; color: #b6cfc2; font-weight: 300">Unlock what Unknown Artist has locked just for fans</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 138px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #4fae63; background: linear-gradient(135deg, #12351d, #08150d); display: flex; align-items: center; padding: 0 6px 0 14px; gap: 10px">
<img src="assets/coin.png" alt="B-Coin" style="width: 30px; height: 30px; object-fit: contain; flex-shrink: 0">
<div style="flex: 1; font-size: 15px; color: #cfe0d5; font-weight: 300">Your balance <b style="color: #fff; font-weight: 600">{{balance}}</b></div>
<a href="Gifts.dc.html" style="height: 32px; padding: 0 14px; border-radius: 16px; background: #7ee08a; color: #06200e; display: flex; align-items: center; font-size: 13.5px; font-weight: 600">Get Coins</a>
</div>
<div style="position: absolute; left: 0; right: 0; top: 198px; height: 700px; overflow-y: auto; scrollbar-width: none">
<div style="padding: 0 20px 40px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<div style="{{it.cardStyle}}">
<div style="height: 108px; position: relative; background: {{it.bg}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"/></svg>
<div style="position: absolute; left: 12px; top: 12px; height: 24px; padding: 0 10px; border-radius: 12px; background: rgba(0,0,0,0.5); display: flex; align-items: center; font-size: 12px; letter-spacing: 0.06em; color: #e9f2ec">{{it.kind}}</div>
<sc-if value="{{it.locked}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; right: 12px; top: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
</sc-if>
</div>
<div style="padding: 12px 14px 14px">
<div style="font-size: 18px; font-weight: 600; color: #fff; line-height: 1.25">{{it.title}}</div>
<div style="margin-top: 4px; font-size: 13.5px; line-height: 1.45; color: #9fbcab; font-weight: 300">{{it.desc}}</div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
<div style="font-size: 13px; color: #8fb09b">{{it.meta}}</div>
<sc-if value="{{it.locked}}" hint-placeholder-val="{{ true }}"><button onClick="{{it.ask}}" style="height: 38px; padding: 0 18px; border: 0; border-radius: 19px; background: #7ee08a; color: #06200e; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Unlock &middot; {{it.price}} B</button></sc-if>
<sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}"><a href="{{it.href}}" style="height: 38px; padding: 0 20px; box-sizing: border-box; border-radius: 19px; border: 1.5px solid #7ee08a; display: flex; align-items: center; color: #c6f5cc; font-size: 15px; font-weight: 600">{{it.openLabel}}</a></sc-if>
</div>
</div>
</div>
</sc-for>
</div>
</div>

<sc-if value="{{confirming}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 20; background: rgba(2,6,3,0.7); display: flex; align-items: flex-end">
<div style="width: 100%; box-sizing: border-box; padding: 26px 24px 44px; border-radius: 30px 30px 0 0; border-top: 1.5px solid #4fae63; background: linear-gradient(180deg, #0f2c18, #050a07 80%); text-align: center">
<div style="width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%; background: rgba(126,224,138,0.16); display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#7ee08a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg></div>
<div style="font-size: 20px; font-weight: 600; color: #fff">Unlock &ldquo;{{cTitle}}&rdquo;?</div>
<div style="margin-top: 8px; font-size: 15px; color: #b6cfc2; font-weight: 300">{{cLine}}</div>
<sc-if value="{{canAfford}}" hint-placeholder-val="{{ true }}">
<button onClick="{{confirmUnlock}}" style="margin-top: 20px; width: 100%; height: 50px; border: 0; border-radius: 25px; background: #7ee08a; color: #06200e; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Pay {{cPrice}} B-Coins</button>
</sc-if>
<sc-if value="{{cantAfford}}" hint-placeholder-val="{{ false }}">
<a href="Gifts.dc.html" style="margin-top: 20px; width: 100%; height: 50px; box-sizing: border-box; border-radius: 25px; background: #7ee08a; color: #06200e; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">Not enough B-Coins &middot; Get Coins</a>
</sc-if>
<button onClick="{{cancel}}" style="margin-top: 10px; width: 100%; height: 44px; border: 0; background: transparent; color: #9fbcab; font-family: inherit; font-size: 16px; cursor: pointer">Cancel</button>
</div>
</div>
</sc-if>

<div style="position: absolute; left: 148px; bottom: 9px; width: 134px; height: 5px; border-radius: 3px; background: rgba(240,255,245,0.9); z-index: 6"></div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1022}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
let b0 = 0; try { const c = localStorage.getItem('brisic-coins'); if (c !== null) b0 = Number(c) || 0; } catch (e) {}
this.state = { balance: b0, unlocked: {}, pending: null };
}
renderVals() {
const s = this.state;
const all = [
{ id: 'song', kind: 'UPCOMING SONG', title: 'Midnight Prayer', desc: 'An unreleased track. Hear it two weeks before everyone else.', meta: 'Drops Nov 14', price: 120, bg: 'linear-gradient(135deg,#1c6be0,#0a2a7a)', icon: 'M24 46V16l26-6v30M24 46a7 7 0 1 1-7-7 7 7 0 0 1 7 7zM50 40a7 7 0 1 1-7-7 7 7 0 0 1 7 7z', href: 'Main.dc.html?play=1&t=Midnight%20Prayer&a=Unknown%20Artist', openLabel: 'Play now' },
{ id: 'ep', kind: 'EXCLUSIVE EPISODE', title: 'Behind the Music, Ep. 4', desc: 'A private conversation about the early days, the studio nights and the people who believed first.', meta: '45 min episode', price: 80, bg: 'linear-gradient(135deg,#7a2a8a,#2a0f45)', icon: 'M32 8a9 9 0 0 0-9 9v13a9 9 0 0 0 18 0V17a9 9 0 0 0-9-9zM14 30a18 18 0 0 0 36 0M32 48v8M24 56h16', href: 'Main.dc.html', openLabel: 'Listen' },
{ id: 'story', kind: 'THE STORY', title: 'How God Carried Me', desc: 'The artist shares the true story of the hard season where faith was the thread, and how it shaped this music.', meta: 'Audio and written story', price: 60, bg: 'linear-gradient(135deg,#d6841a,#5a2a08)', icon: 'M32 6v14M25 13h14M32 20c-12 4-18 14-18 28h36c0-14-6-24-18-28zM32 34v14', href: 'Main.dc.html', openLabel: 'Read & listen' },
{ id: 'vault', kind: 'VIDEO VAULT', title: 'Studio Session Vault', desc: 'Raw studio footage, voice notes and unfinished ideas from the making of the album.', meta: '12 videos', price: 200, bg: 'linear-gradient(135deg,#2f7a34,#10381a)', icon: 'M8 16h36v32H8zM44 28l12-8v24l-12-8z', href: 'Main.dc.html', openLabel: 'Watch' },
{ id: 'album', kind: 'ALBUM PRESALE', title: 'Gratitude (Full Album)', desc: 'Get the whole upcoming album the moment it is ready, with exclusive bonus tracks.', meta: '14 tracks, coming soon', price: 400, bg: 'linear-gradient(135deg,#c0309a,#4a0f55)', icon: 'M32 6a26 26 0 1 0 0 52 26 26 0 0 0 0-52zM32 24a8 8 0 1 0 0 16 8 8 0 0 0 0-16z', href: 'Main.dc.html', openLabel: 'Play now' }
];
const p = all.find((x) => x.id === s.pending);
return {
balance: s.balance.toLocaleString('en-US'),
items: all.map((x) => {
const on = !!s.unlocked[x.id];
return Object.assign({}, x, {
price: x.price, locked: !on, open: on,
cardStyle: 'margin-bottom: 16px; border-radius: 18px; overflow: hidden; border: 1px solid ' + (on ? '#4fae63' : '#2d4a37') + '; background: rgba(14,24,18,0.92)',
ask: () => this.setState({ pending: x.id })
});
}),
confirming: !!p,
cTitle: p ? p.title : '',
cPrice: p ? p.price : 0,
cLine: p ? (s.balance >= p.price ? 'You will have ' + (s.balance - p.price).toLocaleString('en-US') + ' B-Coins left.' : 'You need ' + (p.price - s.balance) + ' more B-Coins.') : '',
canAfford: !!p && s.balance >= p.price,
cantAfford: !!p && s.balance < p.price,
confirmUnlock: () => { if (p && s.balance >= p.price) { const u = Object.assign({}, s.unlocked); u[p.id] = true; try { localStorage.setItem('brisic-coins', String(s.balance - p.price)); } catch (e) {} this.setState({ unlocked: u, balance: s.balance - p.price, pending: null }); } },
cancel: () => this.setState({ pending: null })
};
}
}
</script>
