<div style="margin-top: 8px; font-size: 16px; color: #b6cfc2; font-weight: 300">Official merch from Unknown Artist</div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 146px; height: 600px; overflow-y: auto; scrollbar-width: none">
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 20px 20px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="6">

<div style="font-size: 17px; font-weight: 600; color: #8ee05a">{{p.price}}</div>
<button onClick="{{p.toggle}}" style="{{p.btn}}">{{p.label}}</button>
</div>
</div>
</div>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 762px; height: 64px; box-sizing: border-box; border-radius: 18px; border: 1px solid #4fae63; background: linear-gradient(135deg, #12351d, #08150d); display: flex; align-items: center; padding: 0 12px 0 18px; box-shadow: 0 0 18px rgba(110,230,60,0.18)">

</div>

</div>
</div>
</sc-if>

<div style="position: absolute; left: 148px; bottom: 9px; width: 134px; height: 5px; border-radius: 3px; background: rgba(240,255,245,0.9); z-index: 6"></div>

</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1022}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cart: {}, ordered: false };
}
renderVals() {
const s = this.state;
const items = [
['tee', 'Tour Tee', 25, 'linear-gradient(135deg,#2f7a34,#10381a)', 'M20 10l-12 8 5 10 6-3v29h26V25l6 3 5-10-12-8c-2 5-6 7-12 7s-10-2-12-7z'],
['hoodie', 'Logo Hoodie', 55, 'linear-gradient(135deg,#7a2a8a,#2a0f45)', 'M22 8c0 6 4 9 10 9s10-3 10-9l14 8 4 14-8 4v24H12V34l-8-4 4-14zM28 22v10M36 22v10'],
['cap', 'Snapback Cap', 20, 'linear-gradient(135deg,#d6841a,#5a2a08)', 'M10 40c0-14 10-22 22-22s22 8 22 22zM6 44c10 3 24 3 52 0M32 18v-4'],
['vinyl', 'Vinyl Record', 35, 'linear-gradient(135deg,#1c6be0,#0a2a7a)', 'M32 6a26 26 0 1 0 0 52 26 26 0 0 0 0-52zM32 24a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM32 31v2'],
['poster', 'Tour Poster', 12, 'linear-gradient(135deg,#c0309a,#4a0f55)', 'M14 8h36v48H14zM22 40l8-10 6 7 5-5 5 8M24 20h16'],
['tote', 'Tote Bag', 18, 'linear-gradient(135deg,#1f9a9a,#0a3a4a)', 'M12 22h40l3 36H9zM22 22c0-12 20-12 20 0']
];
const total = items.reduce((n, x) => n + (s.cart[x[0]] ? x[2] : 0), 0);
const count = items.filter((x) => s.cart[x[0]]).length;
return {
products: items.map((x) => {
const on = !!s.cart[x[0]];
return {
name: x[1], price: '$' + x[2], bg: x[3], icon: x[4],
label: on ? 'Added' : 'Add',
btn: 'height: 32px; padding: 0 16px; border-radius: 16px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 1.5px solid #7ee08a; ' + (on ? 'background: #7ee08a; color: #06200e' : 'background: transparent; color: #c6f5cc'),
toggle: () => { const c = Object.assign({}, this.state.cart); if (c[x[0]]) delete c[x[0]]; else c[x[0]] = true; this.setState({ cart: c }); }
};
}),
count: count,
total: '$' + total,
ordered: s.ordered,
checkout: () => { if (count > 0) this.setState({ ordered: true }); },
closeOrder: () => this.setState({ ordered: false, cart: {} })
};
}
}
</script>
