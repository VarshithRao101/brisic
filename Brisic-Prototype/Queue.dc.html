<div style="position: absolute; left: 30px; top: 352px; width: 5px; height: 56px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #1b201e, #3a4540)"></div>
<div style="position: absolute; right: 30px; top: 310px; width: 5px; height: 96px; border-radius: 0 3px 3px 0; background: linear-gradient(270deg, #1b201e, #3a4540)"></div>

<div style="display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px"><div style="font-size: 13px; letter-spacing: 0.08em; color: #7ee08a">UP NEXT &middot; {{count}}</div><button onClick="{{clear}}" style="border: 0; background: transparent; color: #ff8a8a; font-family: inherit; font-size: 14px; cursor: pointer">Clear queue</button></div>
<sc-if value="{{empty}}" hint-placeholder-val="false"><div style="padding: 30px 10px; text-align: center; color: #8fb09b; font-size: 15px">Your queue is empty. Add songs from a playlist.</div></sc-if>

</div></div>
<div style="position: absolute; left: 148px; bottom: 9px; width: 134px; height: 5px; border-radius: 3px; background: rgba(240,255,245,0.9); z-index: 6"></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1022}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { q: [['Calm Down', 'Tobi Rae', 'linear-gradient(150deg,#2a5ac8,#0c1a5a)'], ['Last Last', 'Kelechi Ade', 'linear-gradient(150deg,#e02a2a,#6a0a0a)'], ['Essence', 'Sade Vox ft. Nuela', 'linear-gradient(150deg,#b8782a,#4a2a10)'], ['Sungba', 'Dayo Mane', 'linear-gradient(150deg,#2f7a34,#10381a)'], ['Joy', 'Unknown Artist', 'linear-gradient(150deg,#7a2a8a,#d63a5a)'], ['Late Nights', 'Ayo Blaze', 'linear-gradient(150deg,#142a5a,#070d24)']] };
}
renderVals() {
const q = this.state.q;
let nowT = 'Tornado', nowA = 'Zuri Kaya'; try { const n = JSON.parse(localStorage.getItem('brisic-now') || 'null'); if (n && n.t) { nowT = n.t; nowA = n.a || 'Unknown Artist'; } } catch (e) {}
return {
nowT: nowT, nowA: nowA, nowHref: 'Main.dc.html?play=1&t=' + encodeURIComponent(nowT) + '&a=' + encodeURIComponent(nowA),
count: q.length, empty: q.length === 0,
clear: () => this.setState({ q: [] }),
rows: q.map((x, i) => ({ title: x[0], artist: x[1], bg: x[2],
up: () => { if (i === 0) return; const n = this.state.q.slice(); const t = n[i - 1]; n[i - 1] = n[i]; n[i] = t; this.setState({ q: n }); },
remove: () => { const n = this.state.q.slice(); n.splice(i, 1); this.setState({ q: n }); } }))
};
}
}
</script>
