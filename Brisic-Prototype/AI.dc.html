<html lang="en">
<head>

<script>
var __c = 'AI.dc.html';
(function () { try { var st = JSON.parse(localStorage.getItem('brisic-stack') || '[]'); var back = localStorage.getItem('brisic-back') === '1'; localStorage.setItem('brisic-back', '0'); if (st[st.length - 1] !== __c) { if (back && st.length >= 2 && st[st.length - 2] === __c) { st.pop(); } else { st.push(__c); } } if (st.length > 40) st = st.slice(-40); localStorage.setItem('brisic-stack', JSON.stringify(st)); } catch (e) {} })();
window.brisicPrev = function (fb) { try { var st = JSON.parse(localStorage.getItem('brisic-stack') || '[]'); if (st.length >= 2 && st[st.length - 1] === __c) { var p = st[st.length - 2]; if (p && p !== __c && p !== 'Splash.dc.html') return p; } } catch (e) {} return fb; };
(function () {
function fix() { try { var l = document.querySelectorAll('a[aria-label="Back"]'); for (var i = 0; i < l.length; i++) { var a = l[i]; if (!a.getAttribute('data-o')) a.setAttribute('data-o', a.getAttribute('href') || 'Home.dc.html'); var t = window.brisicPrev(a.getAttribute('data-o')); if (a.getAttribute('href') !== t) a.setAttribute('href', t); } } catch (e) {} }
document.addEventListener('DOMContentLoaded', fix); window.addEventListener('load', fix);
try { new MutationObserver(function () { fix(); }).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) {}
document.addEventListener('click', function (e) { try { var a = e.target.closest && e.target.closest('a[href*="Main.dc.html?"]'); if (!a) return; var q = new URLSearchParams((a.getAttribute('href').split('?')[1] || '')); if (q.get('t')) localStorage.setItem('brisic-now', JSON.stringify({ t: q.get('t').slice(0, 80), a: (q.get('a') || 'Unknown Artist').slice(0, 60) })); } catch (x) {} }, true);
document.addEventListener('click', function (e) { try { if (e.target.closest && e.target.closest('[aria-label="Back"]')) localStorage.setItem('brisic-back', '1'); } catch (x) {} }, true);

<title>Brisic AI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #bbf7d0;outline-offset:3px}
button{font-family:inherit}
input::placeholder{color:#8fa398;opacity:1}
@keyframes brisicPulse{0%{transform:scale(1);opacity:0.55}100%{transform:scale(1.9);opacity:0}}
</style>
</helmet>
<div style="width: 520px; height: 1022px; position: relative; overflow: hidden; background: radial-gradient(90% 60% at 50% 40%, #12201a 0%, #060a08 100%)">

<div style="position: absolute; left: 30px; top: 214px; width: 5px; height: 30px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #1b201e, #3a4540)"></div>
<div style="position: absolute; left: 30px; top: 280px; width: 5px; height: 56px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #1b201e, #3a4540)"></div>
<div style="position: absolute; left: 30px; top: 352px; width: 5px; height: 56px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #1b201e, #3a4540)"></div>
<div style="position: absolute; right: 30px; top: 310px; width: 5px; height: 96px; border-radius: 0 3px 3px 0; background: linear-gradient(270deg, #1b201e, #3a4540)"></div>

<div style="position: absolute; left: 33px; top: 33px; width: 454px; height: 956px; box-sizing: border-box; border-radius: 74px; padding: 12px; background: linear-gradient(145deg, #4b5651 0%, #1a201d 30%, #0b0e0d 60%, #3b4640 100%); box-shadow: 0 0 0 2px #2a322e, 0 30px 70px rgba(0,0,0,0.7), 0 0 60px rgba(74,222,128,0.12)">

<div style="width: 430px; height: 932px; box-sizing: border-box; border-radius: 62px; position: relative; overflow: hidden; background: radial-gradient(100% 50% at 50% 70%, #0f2c18 0%, #050a07 65%, #030504 100%); font-family: 'Outfit', system-ui, sans-serif; color: #e9f2ec; box-shadow: inset 0 0 0 4px #000">

<div style="position: absolute; left: 0; top: 0; width: 430px; height: 54px; z-index: 6">
<div style="position: absolute; left: 56px; top: 17px; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 16px; font-weight: 600; color: #fff">10:00 AM</div>
<div style="position: absolute; right: 38px; top: 19px; display: flex; align-items: center; gap: 6px">
<svg viewBox="0 0 19 12" width="19" height="12" fill="#fff" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="0.8"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.8"/><rect x="10" y="3" width="3" height="9" rx="0.8"/><rect x="15" y="0" width="3" height="12" rx="0.8"/></svg>
<svg viewBox="0 0 17 12" width="17" height="12" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M1 4.3a11 11 0 0 1 15 0M3.6 7a7.3 7.3 0 0 1 9.8 0"/><circle cx="8.5" cy="10" r="1.3" fill="#fff" stroke="none"/></svg>
<svg viewBox="0 0 27 13" width="27" height="13" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#fff" stroke-opacity="0.45"/><rect x="2" y="2" width="19" height="9" rx="2.2" fill="#fff"/><path d="M24.5 4.5v4c.9-.3 1.5-1.2 1.5-2s-.6-1.7-1.5-2z" fill="#fff" fill-opacity="0.5"/></svg>
</div>
</div>
<div style="position: absolute; left: 152px; top: 11px; width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 7">
<div style="position: absolute; right: 13px; top: 10px; width: 17px; height: 17px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #243257 0%, #0a0f1d 45%, #020306 100%)"></div>
</div>

<a href="Home.dc.html" aria-label="Back" style="position: absolute; z-index: 12; left: 22px; top: 70px; width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #7ee08a; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#c6f5cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div style="position: absolute; left: 0; right: 0; top: 70px; height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 24px; font-weight: 700; color: #fff">
<svg viewBox="0 0 24 24" width="24" height="24" fill="#8ee05a" aria-hidden="true"><path d="M10 4l1.8 5.2L17 11l-5.2 1.8L10 18l-1.8-5.2L3 11l5.2-1.8z"/><path d="M18.5 3l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2L15.5 6l2.2-.8z"/></svg>Brisic AI
</div>

<div style="position: absolute; left: 20px; right: 20px; top: 126px; height: 466px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px">
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="1">
<div style="{{m.wrapStyle}}">
<div style="{{m.bubbleStyle}}">{{m.text}}</div>
<sc-if value="{{m.hasResults}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px; width: 316px">
<sc-for list="{{m.results}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; height: 56px; box-sizing: border-box; padding: 0 10px 0 6px; border-radius: 14px; border: 1px solid #2d4a37; background: rgba(18,30,24,0.92)">
<div style="{{r.thumbStyle}}"></div>
<div style="flex: 1; min-width: 0">
<div style="font-size: 15px; color: #f4f8f5; white-space: nowrap; line-height: 1.25">{{r.title}}</div>
<div style="font-size: 12.5px; color: #8fa398; font-weight: 300">{{r.artist}}</div>
</div>
<a href="{{r.href}}" aria-label="Play {{r.title}}" style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; border: 2px solid #7ee08a; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg viewBox="0 0 24 24" width="14" height="14" fill="#e9f2ec" aria-hidden="true" style="margin-left: 2px"><path d="M6 4l14 8-14 8z"/></svg>
</a>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; top: 604px; height: 130px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{listening}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; width: 104px; height: 104px; border-radius: 50%; border: 2px solid #7ee08a; animation: brisicPulse 1.8s ease-out infinite"></div>
<div style="position: absolute; width: 104px; height: 104px; border-radius: 50%; border: 2px solid #7ee08a; animation: brisicPulse 1.8s ease-out 0.9s infinite"></div>
</sc-if>
<button onClick="{{tapListen}}" aria-label="Identify a song" style="position: relative; width: 108px; height: 108px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid #7ee08a; background: radial-gradient(circle at 50% 35%, rgba(110,224,70,0.45), rgba(10,30,16,0.95)); box-shadow: 0 0 34px rgba(126,224,138,0.45), inset 0 0 22px rgba(126,224,138,0.25); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
<svg viewBox="0 0 24 24" width="54" height="54" fill="#d8ffe0" aria-hidden="true"><path d="M10 4l1.8 5.2L17 11l-5.2 1.8L10 18l-1.8-5.2L3 11l5.2-1.8z"/><path d="M18.5 3l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2L15.5 6l2.2-.8z"/></svg>
</button>
</div>
<div style="position: absolute; left: 0; right: 0; top: 736px; text-align: center; font-size: 15px; color: #b6cfc2; font-weight: 300">{{hint}}</div>

<div style="position: absolute; left: 0; right: 0; top: 766px; display: flex; gap: 8px; overflow-x: auto; padding: 0 20px; scrollbar-width: none">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.run}}" style="flex-shrink: 0; height: 34px; padding: 0 14px; box-sizing: border-box; border-radius: 17px; border: 1.5px solid #3f8a50; background: rgba(20,34,26,0.8); color: #d8f5de; font-size: 13.5px; cursor: pointer; white-space: nowrap">{{c.label}}</button>
</sc-for>
</div>

<div style="position: absolute; left: 20px; right: 20px; top: 816px; height: 52px; box-sizing: border-box; border-radius: 26px; border: 1.5px solid #3f8a50; background: rgba(18,32,24,0.9); display: flex; align-items: center; padding: 0 8px 0 20px; gap: 8px">
<input type="text" value="{{input}}" onInput="{{typeInput}}" aria-label="Ask Brisic AI" placeholder="Ask Brisic AI to play anything…" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #eef5f0; font-family: inherit; font-size: 15.5px; font-weight: 300">
<button onClick="{{sendInput}}" aria-label="Send" style="width: 40px; height: 40px; border: 0; border-radius: 50%; background: #7ee08a; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="#06200e" aria-hidden="true"><path d="M2.5 3.5L22 12 2.5 20.5l1.8-7.2L14 12 4.3 10.7z"/></svg>
</button>
</div>

<div style="position: absolute; left: 148px; bottom: 9px; width: 134px; height: 5px; border-radius: 3px; background: rgba(240,255,245,0.9); z-index: 6"></div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1022}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
listening: false,
input: '',
msgs: [{ me: false, text: 'Hi, I am Brisic AI. Tap the big circle to find out what song is playing around you, or ask me to play anything you like.', results: [] }]
};
}
tracks() {
const t = (title, bg) => ({ title: title, artist: 'Unknown Artist', bg: bg, href: 'Main.dc.html?play=1&t=' + encodeURIComponent(title) + '&a=' + encodeURIComponent('Unknown Artist') });
return {
noname: t('No Name', 'radial-gradient(circle at 50% 50%, #3f9a2a, #07120a)'),
lost: t('Lost in the Noise', 'linear-gradient(180deg,#2a4ab8,#c8421a)'),
different: t('Different', 'radial-gradient(circle at 50% 40%, #d8d8d8, #2a2a2a)'),
better: t('Better Days', 'linear-gradient(180deg,#5a6a9a,#e08a5a)'),
still: t('Still Here', 'linear-gradient(180deg,#0a2a10,#2f9a3a)'),
real: t('Real Ones', 'linear-gradient(180deg,#8a8f8c,#3a3f3c)')
};
}
answer(text) {
const q = text.toLowerCase();
const T = this.tracks();
if (q.indexOf('afro') > -1) return { text: 'Here are some Afrobeats picks. Tap play on any of them.', results: [T.better, T.still, T.noname] };
if (q.indexOf('chill') > -1 || q.indexOf('relax') > -1 || q.indexOf('vibe') > -1) return { text: 'Chill mode on. These are easy to listen to.', results: [T.different, T.still, T.real] };
if (q.indexOf('playlist') > -1) return { text: 'I put together a playlist for you with 6 songs. Open it to see them all.', results: [{ title: 'Made for you mix', artist: '6 songs', bg: 'linear-gradient(150deg,#7a2a8a,#d63a5a)', href: 'Playlist.dc.html' }] };
if (q.indexOf('identify') > -1 || q.indexOf('what song') > -1 || q.indexOf('shazam') > -1 || q.indexOf('what is playing') > -1) return { text: 'Tap the big circle and hold your phone near the music. I will tell you what it is.', results: [] };
return { text: 'On it. Here are the top tracks right now.', results: [T.noname, T.lost, T.different] };
}
ask(text) {
const t = text.trim();
if (!t) { return; }
this.setState({ input: '', msgs: this.state.msgs.concat([{ me: true, text: t, results: [] }]) });
setTimeout(() => {
const a = this.answer(t);
this.setState({ msgs: this.state.msgs.concat([{ me: false, text: a.text, results: a.results }]) });
}, 600);
}
renderVals() {
const s = this.state;
const wrap = (me) => 'display: flex; flex-direction: column; align-items: ' + (me ? 'flex-end' : 'flex-start');
const bubble = (me) => 'max-width: 316px; box-sizing: border-box; padding: 11px 15px; border-radius: ' + (me ? '18px 18px 4px 18px' : '18px 18px 18px 4px') + '; font-size: 15px; line-height: 1.4; color: ' + (me ? '#06200e' : '#e9f2ec') + '; background: ' + (me ? 'linear-gradient(90deg,#8ee05a,#5fd48a)' : 'rgba(22,38,28,0.95)') + '; border: ' + (me ? '0' : '1px solid #2d4a37');
const chips = [
{ label: 'Identify a song', run: () => this.tapListen() },
{ label: 'Play Afrobeats', run: () => this.ask('Play Afrobeats') },
{ label: 'Make me a playlist', run: () => this.ask('Make me a playlist') },
{ label: 'Chill vibes', run: () => this.ask('Chill vibes') }
];
return {
listening: s.listening,
input: s.input,
hint: s.listening ? 'Listening… hold your phone near the music' : 'Tap to identify a song',
msgs: s.msgs.map((m) => ({
text: m.text,
wrapStyle: wrap(m.me),
bubbleStyle: bubble(m.me),
hasResults: m.results.length > 0,
results: m.results.map((r) => ({ title: r.title, artist: r.artist, href: r.href, thumbStyle: 'width: 44px; height: 44px; border-radius: 9px; flex-shrink: 0; background: ' + r.bg }))
})),
chips: chips,
typeInput: (e) => this.setState({ input: e.target.value }),
sendInput: () => this.ask(this.state.input),
tapListen: () => this.tapListen()
};
}
tapListen() {
if (this.state.listening) { return; }
this.setState({ listening: true });
setTimeout(() => {
const T = this.tracks();
this.setState({ listening: false, msgs: this.state.msgs.concat([{ me: false, text: 'Found it! That sounds like "Lost in the Noise".', results: [T.lost] }]) });
}, 3000);
}
}
</script>
</body>
</html>
