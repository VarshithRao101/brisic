<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1022}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
let u = '', n = 'Ima Iwok', h = 'ima.official';
try { u = localStorage.getItem('brisic-avatar') || ''; n = localStorage.getItem('brisic-pname') || n; h = localStorage.getItem('brisic-puser') || h; } catch (e) {}
this.state = { url: u, name: n, user: h, err: '', camOpen: false };
}
crop(src, w, h) {
const z = 256, c = document.createElement('canvas'); c.width = z; c.height = z;
const m = Math.min(w, h);
c.getContext('2d').drawImage(src, (w - m) / 2, (h - m) / 2, m, m, 0, 0, z, z);
let d = ''; try { d = c.toDataURL('image/jpeg', 0.85); } catch (x) {}
return d;
}
stopCam() { try { if (this._stream) this._stream.getTracks().forEach((t) => t.stop()); } catch (e) {} this._stream = null; }
renderVals() {
const s = this.state;
return {
camOpen: !!s.camOpen, noPic: !s.url, hasPic: !!s.url, hasErr: !!s.err, err: s.err, name: s.name, user: s.user,
prevStyle: 'width: 154px; height: 154px; border-radius: 50%; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; background: ' + (s.url ? 'url("' + s.url + '") center/cover no-repeat' : 'linear-gradient(#c9803a,#5a2f14)'),
typeName: (e) => this.setState({ name: e.target.value }),
typeUser: (e) => this.setState({ user: e.target.value.toLowerCase().replace(/[^a-z0-9._]/g, '') }),
removePic: () => this.setState({ url: '', err: '' }),
takePhoto: () => {
const fallback = () => { try { document.getElementById('brisicCapInput').click(); } catch (e) {} };
const touch = (navigator.maxTouchPoints || 0) > 0;
if (touch || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { fallback(); return; }
navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then((st) => {
this._stream = st; this.setState({ camOpen: true, err: '' });
setTimeout(() => { const v = document.getElementById('brisicCam'); if (v) { v.srcObject = st; try { v.play(); } catch (e) {} } }, 80);
}).catch(() => fallback());
},
snap: () => {
const v = document.getElementById('brisicCam');
if (!v || !v.videoWidth) return;
const d = this.crop(v, v.videoWidth, v.videoHeight);
this.stopCam();
this.setState(d ? { url: d, camOpen: false, err: '' } : { camOpen: false, err: 'Could not take the picture. Try again.' });
},
closeCam: () => { this.stopCam(); this.setState({ camOpen: false }); },
pick: (e) => {
const f = e.target.files && e.target.files[0];
if (!f) return;
if (!/^image\//.test(f.type)) { this.setState({ err: 'Please choose a picture file.' }); return; }
if (f.size > 12 * 1024 * 1024) { this.setState({ err: 'That photo is too big. Choose one under 12 MB.' }); return; }
const r = new FileReader();
r.onload = () => {
const im = new Image();
im.onload = () => {
const d = this.crop(im, im.width, im.height);
if (d) this.setState({ url: d, err: '' }); else this.setState({ err: 'Could not read that photo. Try another.' });
};
im.onerror = () => this.setState({ err: 'Could not read that photo. Try another.' });
im.src = r.result;
};
r.readAsDataURL(f);
try { e.target.value = ''; } catch (x) {}
},
save: () => {
const st = this.state;
try {
if (st.url) localStorage.setItem('brisic-avatar', st.url); else localStorage.removeItem('brisic-avatar');
localStorage.setItem('brisic-pname', (st.name || '').trim() || 'Ima Iwok');
localStorage.setItem('brisic-puser', st.user || 'ima.official');
} catch (e) {}
}
};
}
}
</script>
