<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1022}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { ep: 0, un: this.readUn(), coins: this.readCoins(), playing: false, prog: 0, speed: 1, caps: true, audio: false };
this._t = setInterval(() => { const s = this.state; if (!s.playing) return; const total = this.eps()[s.ep][2]; const np = s.prog + (100 / total) * s.speed; if (np >= 100) this.setState({ playing: false, prog: 100 }); else this.setState({ prog: np }); }, 1000);
}
eps() {
return [
['Behind the Music, Ep. 4', 'The early days, the studio nights and the people who believed first.', 2700, 'linear-gradient(135deg,#7a2a8a,#2a0f45)', '#2a0f45'],
['The Come Up, Ep. 12', 'Stories of emerging artists breaking out of their city.', 2100, 'linear-gradient(135deg,#d6841a,#5a2a08)', '#3a1d08'],
['Afro Talks, Ep. 31', 'Music, culture and the news that moved the week.', 1800, 'linear-gradient(135deg,#1c6be0,#0a2a7a)', '#0a1d4a'],
['Faith & Frequency, Ep. 8', 'Faith stories told through the songs that carried people.', 2400, 'linear-gradient(135deg,#2f8a3a,#0c3a1a)', '#0c2a14'],
['Studio Session Vault, Ep. 2', 'Raw studio footage and unfinished ideas from the album.', 1500, 'linear-gradient(135deg,#2f7a34,#10381a)', '#0b2a12']
];
}
readUn() { try { return JSON.parse(localStorage.getItem('brisic-unlocked') || '[]'); } catch (e) { return []; } }
readCoins() { try { var c = localStorage.getItem('brisic-coins'); return c === null ? 0 : Number(c); } catch (e) { return 0; } }
lockCost(i) { return { 2: 60, 4: 100 }[i] || 0; }
isLocked(i) { return this.lockCost(i) > 0 && this.state.un.indexOf(i) < 0; }
fmt(sec) { const m = Math.floor(sec / 60), r = Math.floor(sec % 60); return m + ':' + (r < 10 ? '0' : '') + r; }
renderVals() {
const s = this.state; const E = this.eps(); const cur = E[s.ep]; const total = cur[2];
const lk = this.isLocked(s.ep); const cost = this.lockCost(s.ep); const enough = s.coins >= cost;
const pill = (on) => 'height: 34px; padding: 0 14px; border-radius: 17px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; border: 1.5px solid #7ee08a; ' + (on ? 'background: #7ee08a; color: #06200e' : 'background: transparent; color: #e9f2ec');
const caps = ['Welcome back to the show.', 'Today we talk about how it all started.', 'It began in a small room with a borrowed mic.', 'Every song was a letter to the people who believed.', 'Let us get into it.'];
return {
locked: lk, lockNote: enough ? 'Unlock it with coins or send a tip. Your balance: ' + s.coins + ' B-Coins' : 'You need ' + (cost - s.coins) + ' more B-Coins. Tip or top up to watch.', unlockLabel: 'Unlock for ' + cost + ' coins',
unlock: () => { const c = this.state; if (c.coins < cost) return; const nu = c.un.concat([c.ep]); const nc = c.coins - cost; try { localStorage.setItem('brisic-unlocked', JSON.stringify(nu)); localStorage.setItem('brisic-coins', String(nc)); } catch (e) {} this.setState({ un: nu, coins: nc }); },
showName: cur[0].split(',')[0],
epTitle: cur[0], epDesc: cur[1], epMeta: 'Video podcast \u00b7 ' + Math.round(total / 60) + ' min',
sceneBg: cur[4], showVideo: !s.audio, audioOnly: s.audio, captionsOn: s.caps && !s.audio, caption: caps[Math.floor(s.prog / 8) % caps.length],
playing: s.playing, paused: !s.playing, prog: Math.round(s.prog), timeNow: this.fmt(total * s.prog / 100), timeTotal: this.fmt(total), speed: s.speed,
pill: pill(false), capsPill: pill(s.caps), audioPill: pill(s.audio),
toggle: () => this.isLocked(this.state.ep) ? null : this.setState({ playing: !this.state.playing, prog: this.state.prog >= 100 ? 0 : this.state.prog }),
seek: (e) => this.setState({ prog: Number(e.target.value) }),
cycleSpeed: () => { const o = [1, 1.25, 1.5, 2]; this.setState({ speed: o[(o.indexOf(this.state.speed) + 1) % o.length] }); },
toggleCaps: () => this.setState({ caps: !this.state.caps }), toggleAudio: () => this.setState({ audio: !this.state.audio }),
back15: () => this.setState({ prog: Math.max(0, this.state.prog - 1500 / total) }), fwd15: () => this.setState({ prog: Math.min(100, this.state.prog + 1500 / total) }),
eps: E.map((x, i) => ({ title: x[0], meta: Math.round(x[2] / 60) + ' min \u00b7 Video' + (this.isLocked(i) ? ' \u00b7 Locked \u00b7 ' + this.lockCost(i) + ' coins' : ''), bg: x[3], style: 'width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px; margin-bottom: 8px; border-radius: 14px; font-family: inherit; cursor: pointer; border: 1px solid ' + (i === s.ep ? '#7ee08a' : '#233229') + '; background: ' + (i === s.ep ? 'rgba(30,60,40,0.8)' : 'rgba(18,30,24,0.85)'), pick: () => this.setState({ ep: i, prog: 0, playing: true }) }))
};
}
}
</script>
