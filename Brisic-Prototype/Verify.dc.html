<title>Verify Email</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #bbf7d0;outline-offset:3px}
input::placeholder{color:#8fa398;opacity:1}
</style>
</helmet>
<div style="width: 520px; height: 1022px; position: relative; overflow: hidden; background: radial-gradient(90% 60% at 50% 40%, #12201a 0%, #060a08 100%)">

<div style="position: absolute; left: 30px; top: 214px; width: 5px; height: 30px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #1b201e, #3a4540)"></div>
<div style="position: absolute; left: 30px; top: 280px; width: 5px; height: 56px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #1b201e, #3a4540)"></div>
<div style="position: absolute; left: 30px; top: 352px; width: 5px; height: 56px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #1b201e, #3a4540)"></div>
<div style="position: absolute; right: 30px; top: 310px; width: 5px; height: 96px; border-radius: 0 3px 3px 0; background: linear-gradient(270deg, #1b201e, #3a4540)"></div>

<div style="position: absolute; left: 33px; top: 33px; width: 454px; height: 956px; box-sizing: border-box; border-radius: 74px; padding: 12px; background: linear-gradient(145deg, #4b5651 0%, #1a201d 30%, #0b0e0d 60%, #3b4640 100%); box-shadow: 0 0 0 2px #2a322e, 0 30px 70px rgba(0,0,0,0.7), 0 0 60px rgba(74,222,128,0.12)">

<div style="width: 430px; height: 932px; box-sizing: border-box; border-radius: 62px; position: relative; overflow: hidden; background: radial-gradient(100% 50% at 50% 0%, #0f2c18 0%, #050a07 60%, #030504 100%); font-family: 'Outfit', system-ui, sans-serif; color: #e9f2ec; box-shadow: inset 0 0 0 4px #000">

<div style="position: absolute; left: 0; top: 0; width: 430px; height: 54px; z-index: 6">
<div style="position: absolute; left: 56px; top: 17px; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 16px; font-weight: 600; color: #fff">10:00 AM</div>
<div style="position: absolute; right: 38px; top: 19px; display: flex; align-items: center; gap: 6px">
<svg viewBox="0 0 19 12" width="19" height="12" fill="#fff" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="0.8"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.8"/><rect x="10" y="3" width="3" height="9" rx="0.8"/><rect x="15" y="0" width="3" height="12" rx="0.8"/></svg>
<svg viewBox="0 0 17 12" width="17" height="12" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M1 4.3a11 11 0 0 1 15 0M3.6 7a7.3 7.3 0 0 1 9.8 0"/><circle cx="8.5" cy="10" r="1.3" fill="#fff" stroke="none"/></svg>
<svg viewBox="0 0 27 13" width="27" height="13" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#fff" stroke-opacity="0.45"/><rect x="2" y="2" width="19" height="9" rx="2.2" fill="#fff"/><path d="M24.5 4.5v4c.9-.3 1.5-1.2 1.5-2s-.6-1.7-1.5-2z" fill="#fff" fill-opacity="0.5"/></svg>
</div>
</div>
<div style="position: absolute; left: 152px; top: 11px; width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 7">
<div style="position: absolute; right: 13px; top: 10px; width: 17px; height: 17px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #243257 0%, #0a0f1d 45%, #020306 100%)"></div>
</div>

<a href="CreateAccount.dc.html" aria-label="Back" style="position: absolute; z-index: 12; left: 22px; top: 74px; width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #7ee08a; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#c6f5cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div style="position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; padding: 0 26px; box-sizing: border-box">
<div style="width: 84px; height: 84px; border-radius: 50%; background: rgba(126,224,138,0.14); border: 1.5px solid #4fae63; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 26px rgba(110,230,60,0.25)">
<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#7ee08a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
</div>
<h1 style="margin: 22px 0 0; font-size: 29px; font-weight: 700; color: #fff; text-align: center">Check your email</h1>
<div style="margin-top: 10px; font-size: 15.5px; line-height: 1.55; color: #b6cfc2; font-weight: 300; text-align: center">We sent a 6-digit code to your email.<br>Enter it below to verify your account.</div>

<div style="position: relative; margin-top: 34px; width: 100%; max-width: 340px; height: 62px">
<div style="display: flex; gap: 10px; justify-content: space-between">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="6"><div style="{{b.style}}">{{b.d}}</div></sc-for>
</div>
<input type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" value="{{code}}" onInput="{{typeCode}}" aria-label="6-digit code" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: text; font-size: 16px">
</div>

<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
<a href="Home.dc.html" style="margin-top: 30px; width: 100%; max-width: 340px; height: 52px; box-sizing: border-box; border-radius: 26px; background: #7ee08a; color: #06200e; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">Verify and continue</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 30px; width: 100%; max-width: 340px; height: 52px; box-sizing: border-box; border-radius: 26px; background: rgba(126,224,138,0.18); color: #6f9a7a; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">Verify and continue</div>
</sc-if>

<div style="margin-top: 22px; font-size: 14.5px; color: #8fb09b; font-weight: 300">{{resendLine}}</div>
<sc-if value="{{canResend}}" hint-placeholder-val="{{ false }}"><button onClick="{{resend}}" style="margin-top: 6px; border: 0; background: transparent; color: #7ee08a; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Resend code</button></sc-if>
<div style="margin-top: 26px; padding: 10px 14px; border-radius: 12px; border: 1px dashed #2d4a37; font-size: 12.5px; color: #7f9d8b; font-weight: 300; text-align: center; line-height: 1.5">Prototype: type any 6 digits to continue.<br>In the real app the code is emailed and checked.</div>
</div>

<div style="position: absolute; left: 148px; bottom: 9px; width: 134px; height: 5px; border-radius: 3px; background: rgba(240,255,245,0.9); z-index: 6"></div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1022}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { code: '', secs: 30 };
this._iv = setInterval(() => { if (this.state.secs > 0) this.setState({ secs: this.state.secs - 1 }); }, 1000);
}
renderVals() {
const s = this.state;
const box = (i) => 'width: 48px; height: 62px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: #fff; background: rgba(14,24,18,0.9); border: 1.5px solid ' + (i === s.code.length ? '#7ee08a' : (i < s.code.length ? '#4fae63' : '#2d4a37'));
const boxes = [0, 1, 2, 3, 4, 5].map((i) => ({ d: s.code[i] || '', style: box(i) }));
return {
boxes: boxes,
code: s.code,
typeCode: (e) => this.setState({ code: e.target.value.replace(/\D/g, '').slice(0, 6) }),
ready: s.code.length === 6,
notReady: s.code.length < 6,
canResend: s.secs === 0,
resendLine: s.secs > 0 ? 'Resend code in 0:' + String(s.secs).padStart(2, '0') : "Didn't get the code?",
resend: () => this.setState({ secs: 30, code: '' })
};
}
}
</script>
</body>
</html>
