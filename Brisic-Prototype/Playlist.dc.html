<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1022}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cur: -1, playing: false, prog: 0, optOpen: false, toast: '' };
this.voiceInit();
this.durs = [204, 178, 242, 197, 227, 155, 241];
this._pv = setInterval(() => this.pTick(), 1000);
}
pTick() {
const s = this.state;
if (!s.playing || s.cur < 0) return;
const d = this.durs[s.cur];
const np = s.prog + 100 / d * 4;
if (np >= 100) this.setState({ cur: (s.cur + 1) % this.durs.length, prog: 0 });
else this.setState({ prog: np });
}
flash(m) { this.setState({ toast: m }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: '' }), 2200); }
voiceInit() {
this.state = Object.assign({}, this.state, { vOpen: false, vPhase: 'idle', vHeard: '', vReply: '', vResults: [], vRound: 0 });
this._t = [];
}
vClear() { (this._t || []).forEach(clearTimeout); this._t = []; }
vLater(fn, ms) { this._t = this._t || []; this._t.push(setTimeout(fn, ms)); }
vStart() {
this.vClear();
const rounds = [
{ say: 'Play some Afrobeats for me', reply: 'Here are some Afrobeats picks', res: [['Last Last', 'Kelechi Ade', 'linear-gradient(150deg,#e08a3a,#5a2a10)'], ['Calm Down', 'Tobi Rae', 'linear-gradient(150deg,#2a8a8a,#0c2a30)'], ['Sungba', 'Dayo Mane', 'linear-gradient(170deg,#f07a2a,#8a2a0a)']] },
{ say: 'What song is this?', reply: 'Found it! This sounds like Lost in the Noise', res: [['Lost in the Noise', 'Unknown Artist', 'linear-gradient(180deg,#2a4ab8 0%,#c8421a 70%,#3a1a10 100%)'], ['No Name', 'Unknown Artist', 'radial-gradient(circle at 50% 50%, #3f9a2a, #07120a)']] },
{ say: 'Something chill for tonight', reply: 'Chill vibes coming up', res: [['Essence', 'Nuela', 'linear-gradient(150deg,#9a5ab8,#2a0f45)'], ['Joy', 'Sade Vox', 'linear-gradient(150deg,#2a5ac8,#0c1a5a)'], ['Better Days', 'Unknown Artist', 'linear-gradient(180deg,#5a6a9a 0%,#e08a5a 60%,#3a2a3a 100%)']] }
];
const r = rounds[this.state.vRound % rounds.length];
this.setState({ vOpen: true, vPhase: 'listening', vHeard: '', vReply: '', vResults: [], vRound: this.state.vRound + 1 });
const words = r.say.split(' ');
words.forEach((w, i) => this.vLater(() => this.setState({ vHeard: words.slice(0, i + 1).join(' ') }), 900 + i * 450));
const tEnd = 900 + words.length * 450 + 700;
this.vLater(() => this.setState({ vPhase: 'thinking' }), tEnd);
this.vLater(() => this.setState({ vPhase: 'result', vReply: r.reply, vResults: r.res }), tEnd + 1200);
}
vClose() { this.vClear(); this.setState({ vOpen: false, vPhase: 'idle', vHeard: '', vReply: '', vResults: [] }); }
voiceVals() {
const s = this.state;
const bars = [];
for (let i = 0; i < 28; i++) {
const d = (0.55 + ((i * 37) % 10) / 14).toFixed(2);
const dl = (((i * 53) % 10) / 12).toFixed(2);
const h = 30 + ((i * 29) % 7) * 12;
bars.push({ style: 'width:5px;border-radius:3px;background:#8ee05a;box-shadow:0 0 8px rgba(142,224,90,0.55);height:' + h + 'px;transform-origin:center;animation:brisicWave ' + d + 's ease-in-out ' + dl + 's infinite' });
}
const st = { listening: 'Listening…', thinking: 'Thinking…', result: 'Here you go' };
return {
vOpen: !!s.vOpen,
vStatus: st[s.vPhase] || '',
vListening: s.vPhase === 'listening',
vThinking: s.vPhase === 'thinking',
vResult: s.vPhase === 'result',
vBars: bars,
vHeard: s.vHeard ? '“' + s.vHeard + '”' : '',
vReply: s.vReply,
vResults: (s.vResults || []).map((x) => ({ play: 'Main.dc.html?play=1&t=' + encodeURIComponent(x[0]) + '&a=' + encodeURIComponent(x[1]), title: x[0], artist: x[1], thumbStyle: 'width:48px;height:48px;border-radius:8px;flex-shrink:0;background:' + x[2] })),
openVoice: () => this.vStart(),
closeVoice: () => this.vClose(),
talkAgain: () => this.vStart()
};
}
renderVals() {
const list = [
['VIBE HIGH', 204], ['NO LIMIT', 178], ['ALL NIGHT', 242], ['MY WAY', 197], ['FOREVER', 227], ['NEVER STOP', 155], ['ONE LIFE', 241], ['GOLDEN HOUR', 189], ['LAGOS LIGHTS', 212], ['RUN IT UP', 168], ['SLOW DOWN', 236], ['HIGHER', 201], ['GOOD ENERGY', 193], ['TAKE ME HOME', 223], ['SUNRISE', 175], ['FEEL IT', 208], ['WAVE', 184], ['LAST DANCE', 249]
];
const fmt = (t) => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
const colors = list.map((x, i) => ['#8ee05a', '#7edc62', '#86e070', '#8ee05a', '#8ae05e', '#80dc68'][i % 6]);
const S = this.state;
const titles = list.map((x) => x[0]);
const ARTISTS = ['Kelechi Ade', 'Tobi Rae', 'Nuela', 'Dayo Mane', 'Sade Vox', 'Kofi Lane', 'Zuri Kaya', 'Ayo Blaze', 'Fireboy DML', 'Omah Lay', 'Ruger', 'CKay', 'Joeboy', 'Adekunle Gold', 'Kizz Daniel', 'Olamide', 'Black Sherif', 'Libianca'];
const artistOf = (i) => ARTISTS[i % ARTISTS.length];
const recHist = (t, sub) => { try { let h = JSON.parse(localStorage.getItem('brisic-history') || '[]'); h = h.filter((x) => x.t !== t); h.unshift({ t: t, s: sub }); localStorage.setItem('brisic-history', JSON.stringify(h.slice(0, 30))); } catch (e) {} };
if (S.cur >= 0 && S.playing && this._rec !== S.cur) { this._rec = S.cur; recHist(titles[S.cur], artistOf(S.cur)); }
return Object.assign(this.voiceVals(), {
optOpen: !!S.optOpen, hasToast: !!S.toast, toast: S.toast || "",
openOpt: () => this.setState({ optOpen: true }), closeOpt: () => this.setState({ optOpen: false }),
doShare: () => { this.setState({ optOpen: false }); this.flash('Link copied. Share it with friends.'); },
doAdd: () => { this.setState({ optOpen: false }); this.flash('Added to your library.'); },
doSave: () => { this.setState({ optOpen: false }); this.flash('Downloading. Available offline in Library.'); },

hasCur: S.cur >= 0, playing: S.playing, paused: !S.playing, prog: Math.round(S.prog), curTitle: S.cur >= 0 ? titles[S.cur] : '', curArtist: S.cur >= 0 ? artistOf(S.cur) : '', curHref: S.cur >= 0 ? 'Main.dc.html?play=1&t=' + encodeURIComponent(titles[S.cur]) + '&a=' + encodeURIComponent(artistOf(S.cur)) : 'Main.dc.html?play=1',
playAll: () => { const t = this.state; if (t.cur < 0) this.setState({ cur: 0, playing: true, prog: 0 }); else this.setState({ playing: !t.playing }); },
shuffleAll: () => this.setState({ cur: Math.floor(Math.random() * titles.length), playing: true, prog: 0 }),
toggleNow: () => this.setState({ playing: !this.state.playing }),
prevSong: () => this.setState({ cur: (this.state.cur + titles.length - 1) % titles.length, prog: 0 }),
nextSong: () => this.setState({ cur: (this.state.cur + 1) % titles.length, prog: 0 }),
songs: list.map((x, i) => ({ more: (e) => { try { e.stopPropagation(); } catch (x2) {} this.setState({ optOpen: true }); }, n: i + 1, title: x[0], time: fmt(x[1]), numColor: this.state.cur === i ? '#ffffff' : colors[i], nLabel: this.state.cur === i ? (this.state.playing ? '\u266B' : '\u275A\u275A') : (i + 1) + '.', titleColor: this.state.cur === i ? '#7ee08a' : '#f1f7f3', rowStyle: 'display: flex; align-items: center; height: 62px; width: 100%; box-sizing: border-box; padding: 0 20px 0 20px; border-radius: 0; font-family: inherit; cursor: pointer; text-align: left; border: 0; background: ' + (this.state.cur === i ? 'rgba(30,70,40,0.9)' : '#000'), tap: () => this.setState({ cur: i, playing: true, prog: 0 }), streams: ['2.1M', '1.6M', '3.4M', '987K', '1.2M', '640K', '2.8M', '1.9M', '2.4M', '870K', '1.1M', '3.1M', '760K', '1.4M', '920K', '2.2M', '580K', '1.7M'][i] + ' streams' })),
total: fmt(list.reduce((s, x) => s + x[1], 0))
});
}
}
</script>
