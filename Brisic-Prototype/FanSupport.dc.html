<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1022}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { msg: '', note: false };
}
renderVals() {
const s = this.state;
return {
msg: s.msg,
noteShown: s.note,
typeMsg: (e) => this.setState({ msg: e.target.value, note: false }),
sendMsg: () => { if (this.state.msg.trim()) { this.setState({ msg: '', note: true }); } }
};
}
}
